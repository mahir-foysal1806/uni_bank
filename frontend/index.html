<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>UniQBank - University Question Papers, Notes & Study Materials</title>

    <meta
      name="description"
      content="UniQBank is a university question-bank and academic resource platform for finding past exam papers, notes, books and syllabus materials."
    />

    <meta
      name="keywords"
      content="university question bank, university question papers, previous questions, exam questions, university notes, study materials, Bangladesh students, UniQBank"
    />

    <meta name="robots" content="index, follow" />

    <meta name="author" content="UniQBank" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://uni-bank-1.onrender.com/"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="UniQBank - University Question Papers & Study Materials"
    />

    <meta
      property="og:description"
      content="Find, search and download university question papers, notes, books and study materials with UniQBank."
    />

    <meta
      property="og:url"
      content="https://uni-bank-1.onrender.com/"
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:site_name"
      content="UniQBank"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="UniQBank - University Question Bank"
    />

    <meta
      name="twitter:description"
      content="Find university question papers, notes, books and study materials with UniQBank."
    />

    <!-- Theme -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "UniQBank",
        "url": "https://uni-bank-1.onrender.com/",
        "description": "UniQBank is a university question-bank and academic resource platform for finding past exam papers, notes, books and syllabus materials.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://uni-bank-1.onrender.com/questions?keyword={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "UniQBank",
        "url": "https://uni-bank-1.onrender.com/",
        "description": "A simple university resource platform for students to find and share past exam question papers, notes, books and syllabus materials."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
